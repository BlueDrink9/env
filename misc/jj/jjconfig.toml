#:schema https://docs.jj-vcs.dev/latest/config-schema.json
[aliases]
s = ["status"]
l = ["log"]
ol = ["op", "log"]
d = ["diff"]
rm = ["abandon"]
heads = ["log", "-r", "heads(all())"]
grepDesc = [
  'util', 'exec', '--', 'sh', '-c',
  'jj log -r "description(substring:$0)"'
]
# Adds a new commit as a parent of the current merge (includes all existing parent commits).
add-parent = ["rebase", "--source", "@", "--destination", "@-", "--destination"]
remove-parent = [
  'util', 'exec', '--', 'sh', '-c',
  "jj rebase --source @ -d '@- ~$1'"
]
ignore = [
  'util', 'exec', '--', 'sh', '-c',
  'jj config set --repo snapshot.auto-track "$(jj config get snapshot.auto-track) & ~$0" && jj file untrack $0'
]
#jj rebase -s 'all:roots(trunk..@)' -o trunk

[ui]
default-command = ["status"]

[git]
# Never push commits like these
private-commits = "description('wip:*') | description('private:*')"

[merge-tools.diffview]
program = 'nvim'
merge-args = ['-n', '-c', 'DiffviewMergeFiles $output $base $left $right']
merge-tool-edits-conflict-markers = true
conflict-marker-style = 'git'

