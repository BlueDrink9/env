#:schema https://docs.jj-vcs.dev/latest/config-schema.json
[aliases]
c = ["commit"]
stale = ["workspace", "update-stale"]
s = ["status"]
l = ["log"]
ol = ["op", "log"]
d = ["diff"]
rm = ["abandon"]
heads = ["log", "-r", "heads(all())"]
grepDesc = [
  'util', 'exec', '--', 'sh', '-c',
  'jj log -r "description(substring:$0)"'
]
  
force-push = [
  "util", "exec", "--", "sh", "-c",
  """
  bookmark="${1:-$(jj log -r @ --no-graph -T 'local_bookmarks.map(|b| b.name()).join("\n")' | head -n 1)}"

  if [ -z "$bookmark" ]; then
    echo "Error: No bookmark found at @ and none provided." >&2
    exit 1
  fi

  echo "Force-pushing '$bookmark'..."
  jj git fetch --bookmark "$bookmark" && \
  jj bookmark set "$bookmark" -r @ --allow-backwards && \
  jj git push --bookmark "$bookmark"
  """,
  "_"
]

# Usage: jj resolve-bm [bookmark_name]
resolve-bm = [
  "util", "exec", "--", "sh", "-c",
  """
  bookmark="${1:-$(jj log -r @ --no-graph -T 'local_bookmarks.map(|b| b.name()).join("\n")' | head -n 1)}"

  if [ -z "$bookmark" ]; then
    echo "Error: No bookmark specified and no local bookmark found at @." >&2
    exit 1
  fi

  echo "Setting bookmark '$bookmark' to @..."
  jj bookmark set "$bookmark" -r @ --allow-backwards
  """,
  "_"
]

# Adds a new commit as a parent of the current merge (includes all existing parent commits).
add-parent = ["rebase", "--source", "@", "--destination", "@-", "--destination"]
remove-parent = [
  'util', 'exec', '--', 'sh', '-c',
  "jj rebase --source @ -d '@- ~$1'"
]
ignore = [
  'util', 'exec', '--', 'sh', '-c',
  'jj config set --repo snapshot.auto-track "$(jj config get snapshot.auto-track) & ~$0" && jj file untrack $0'
]
#jj rebase -s 'all:roots(trunk..@)' -o trunk

[ui]
default-command = ["status"]

[git]
# Never push commits like these
private-commits = "description('wip:*') | description('private:*')"

[merge-tools.diffview]
program = 'nvim'
merge-args = ['-n', '-c', 'DiffviewMergeFiles $output $base $left $right']
merge-tool-edits-conflict-markers = true
conflict-marker-style = 'git'

